<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechNova Knowledge Base</title>
<style>
  body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;display:flex;justify-content:center;padding:20px}
  .box{background:#fff;width:100%;max-width:640px;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  h1{font-size:20px;margin:0 0 12px}
  input{padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px}
  button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
  #login input{display:block;width:calc(100% - 22px);margin-bottom:10px}
  #chat{display:none}
  #messages{height:380px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-bottom:10px}
  .msg{margin:8px 0;padding:8px 12px;border-radius:10px;max-width:85%;white-space:pre-wrap}
  .user{background:#dbeafe;margin-left:auto}
  .bot{background:#f3f4f6}
  .src{font-size:12px;color:#6b7280;margin-top:4px}
  .row{display:flex;gap:8px}
  .row input{flex:1}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .top button{background:#6b7280;padding:6px 12px;font-size:13px}
  #err{color:#b91c1c;font-size:14px;margin-top:8px}
  .hint{font-size:12px;color:#6b7280;margin-top:10px}
</style>
</head>
<body>
<div class="box">
  <h1>TechNova Knowledge Base Assistant</h1>

  <div id="login">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Log in</button>
    <div class="hint">Demo logins: asha / employee123 (employee), ravi / hr123 (HR)</div>
  </div>

  <div id="chat">
    <div class="top">
      <span id="who"></span>
      <button onclick="logout()">Log out</button>
    </div>
    <div id="messages"></div>
    <div class="row">
      <input id="question" placeholder="Ask a question about company policies..." onkeydown="if(event.key==='Enter')ask()">
      <button id="sendBtn" onclick="ask()">Send</button>
    </div>
  </div>

  <div id="err"></div>
</div>

<script>
let token = "";

function show(id, on){ document.getElementById(id).style.display = on ? "block" : "none"; }
function setErr(t){ document.getElementById("err").textContent = t || ""; }

async function login(){
  setErr("");
  const res = await fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  });
  const data = await res.json();
  if(!res.ok){ setErr(data.detail || "Login failed"); return; }
  token = data.token;
  document.getElementById("who").textContent = "Logged in as role: " + data.role;
  document.getElementById("messages").innerHTML = "";
  show("login", false);
  show("chat", true);
}

function logout(){
  token = "";
  show("chat", false);
  show("login", true);
  setErr("");
}

function addMessage(text, cls, sources){
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  if(sources && sources.length){
    const s = document.createElement("div");
    s.className = "src";
    s.textContent = "Sources: " + sources.map(x => x.file + " (p." + x.page + ")").join(", ");
    div.appendChild(s);
  }
  const box = document.getElementById("messages");
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function ask(){
  const input = document.getElementById("question");
  const q = input.value.trim();
  if(!q) return;
  input.value = "";
  setErr("");
  addMessage(q, "user");
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
      body: JSON.stringify({question: q})
    });
    const data = await res.json();
    if(!res.ok){ addMessage(data.detail || "Something went wrong", "bot"); }
    else { addMessage(data.answer, "bot", data.sources); }
  } catch(e){
    addMessage("Could not reach the server.", "bot");
  }
  btn.disabled = false;
}
</script>
</body>
</html>
